[project]
name = "tg-max-bridge"
version = "0.1.0"
description = "Telegram command-to-MAX bridge using max-mcp"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiohttp>=3.13.2",
  "aiosqlite==0.22.1",
  "mcp==1.28.1",
  "pydantic-settings>=2.12.0",
  "python-telegram-bot==22.8",
  "typer>=0.20.0",
]

[project.scripts]
tg-max-bridge = "tg_max_bridge.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_max_bridge"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tg_max_bridge"]
